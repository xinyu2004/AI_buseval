# Qualcomm SA8155P (Snapdragon 8155) — IVI SoC preset. Public-spec estimates; verify.
masters:
  - {name: CAN0, type: can, enabled: false, params: {bitrate_mbps: 0.5, load_pct: 0.3}}
  - {name: CAN1, type: can, enabled: false, params: {bitrate_mbps: 0.5, load_pct: 0.3}}
  - {name: CSI0, type: mipi_csi, params: {width: 1920, height: 1080, fps: 30, format: raw12, bpp: 12, lanes: 4, count: 4}}
  - {name: CSI1, type: mipi_csi, params: {width: 1280, height: 720, fps: 30, format: raw12, bpp: 12, lanes: 2}}
  - {name: USB0, type: usb, params: {version: "3", util_pct: 0.3}}
  - {name: USB1, type: usb, params: {version: "2", util_pct: 0.2}}
  - {name: ETH0, type: eth, params: {link_gbps: 1, util_pct: 0.3, mtu: 1500}}
  - {name: UFS0, type: flash, params: {type: ufs, seq_read_mbps: 2000, seq_write_mbps: 1200, util_pct: 0.3, random_ratio: 0.3}}
pipelines:
  - name: ISP0
    type: isp
    source: CSI1              # option: inherit input stream from a master (CSI/DSI). Null = use params.width/height/fps.
    mode: serial
    stages:
      - {name: bayer, format: raw12, width: 1280, height: 720, read_factor: 1.0, write_factor: 1.0}
      - {name: demosaic, format: rgb888, width: 1280, height: 720, read_factor: 1.5, write_factor: 1.0}
      - {name: yuv_scale, format: yuv420, width: 1280, height: 720, read_factor: 1.0, write_factor: 1.0}
  - name: VENC0
    type: venc
    source: ISP0
    params: {width: 1920, height: 1080, fps: 30, format: yuv422, bpp: 16, codec: h264}
  - name: GPU0
    type: gpu
    params: {width: 1920, height: 720, fps: 60, format: rgba8888, bpp: 32, overdraw: 3}
  - name: DISP0
    type: display
    source: ISP0
  - name: DSI0
    type: mipi_dsi            # p2p: DSI carries Display's output to the physical MIPI DSI lanes
    source: DISP0
    params: {lanes: 4}
ddr_channels:
  - name: DDR0
    controller_mt_s: 4266           # SA8155 LPDDR4X controller supports up to 4266 MT/s
    controller_width_bits: 32       # 32-bit per group
    controller_groups: 2            # 2×32-bit = 64-bit effective
    controller_type: LPDDR4X
    module_mt_s: 4266               # external LPDDR4X-4266 module
    module_width_bits: 32
    module_groups: 2
    module_type: LPDDR4X
    efficiency: 0.7
alert_thresholds: {yellow: 0.6, red: 0.8}
